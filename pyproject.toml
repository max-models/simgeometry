[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools", "wheel" ]

[project]
name = "simgeometry"
version = "0.1.1"
description = "Shapes, grids, and simulation domains for numerical simulations"
readme = "README.md"
keywords = [ "geometry", "grids", "simulation", "mpi" ]
license = "MIT"
license-files = [ "LICENSE.txt" ]
authors = [ { name = "Max" } ]
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "cunumpy>=0.6.2",
  "maybempi>=0.1",
  "mpiarray>=0.1.0",
  "numpy",
  "scope-profiler>=0.7.5",
]
optional-dependencies.dev = [
  "jupyterlab",
  "pre-commit",
  "pyproject-fmt",
  "pyright",
  "ruff",
  "simgeometry[docs,test]",
]
optional-dependencies.docs = [
  "griffe",
  "simgeometry[clip,interactive]",
  # interactive 3-D scenes in the notebooks (plasma_plots.scene)
  "plasma-plots[scene]>=0.2.5",
  "ipykernel",
  "matplotlib>=3.10.9",
  "nbclient>=0.11",
  "nbformat>=5.11.1",
]
optional-dependencies.clip = [ "shapely>=2" ]
optional-dependencies.evaluate = [ "xarray" ]
optional-dependencies.mesh = [ "scikit-image>=0.22" ]
optional-dependencies.plot = [ "matplotlib>=3.10", "simgeometry[evaluate,mesh]" ]
optional-dependencies.interactive = [ "plasma-plots>=0.2.5", "pyvista>=0.44", "simgeometry[plot]" ]
optional-dependencies.mpi = [ "mpi4py" ]
optional-dependencies.pyccel = [ "pyccel>2.0" ]
optional-dependencies.gpu = [ "cupy-cuda12x" ]
optional-dependencies.metal = [ "mlx; sys_platform == 'darwin' and platform_machine == 'arm64'" ]
optional-dependencies.test = [ "mpi4py", "pytest", "pytest-cov", "simgeometry[clip]" ]
urls.Source = "https://github.com/max-models/simgeometry"

[tool.setuptools]
package-data."*" = [ "py.typed" ]
package-data.simgeometry = [ "kernels/*/*.cu" ]
packages.find.where = [ "src" ]
packages.find.exclude = [ "simgeometry.tests*" ]

[tool.ruff]
target-version = "py310"
line-length = 88
extend-include = [ "*.ipynb" ]
# Keep linting focused while the geometry code retains its existing docstrings.
lint.select = [ "E", "F", "I", "W" ]
lint.ignore = [ "E501" ]  # line length is handled by the formatter
lint.per-file-ignores."**/tests/**" = [ "E402" ]
lint.pydocstyle.convention = "google"

[tool.pyright]
include = [ "src" ]
exclude = [ "**/tests" ]
pythonVersion = "3.10"
# The extracted code predates strict typing; keep import resolution checked.
typeCheckingMode = "off"
reportMissingImports = "error"

[tool.pytest]
ini_options.pythonpath = [ "src" ]
ini_options.testpaths = [ "src" ]
ini_options.addopts = "-ra"

[tool.coverage]
run.omit = [ "*/tests/*" ]
run.source = [ "simgeometry" ]
report.show_missing = true

# PRs to devel test against the devel branches of the max-models packages (pinned in
# uv.lock); PRs to main and the release use PyPI only (CI sets UV_NO_SOURCES).
[tool.uv.sources]
cunumpy = { git = "https://github.com/max-models/cunumpy", branch = "devel" }
maybempi = { git = "https://github.com/max-models/maybempi", branch = "devel" }
mpiarray = { git = "https://github.com/max-models/mpiarray", branch = "devel" }
plasma-plots = { git = "https://github.com/max-models/plasma-plots", branch = "devel" }
scope-profiler = { git = "https://github.com/max-models/scope-profiler", branch = "devel" }
