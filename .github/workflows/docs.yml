name: Docs

# The Astro + Starlight site in docs/: hand-written pages, the executed notebooks and the API
# reference. Built on every push and pull request with the shared workflow of
# max-models/starlight-theme; deployed to GitHub Pages from devel.

on:
  push:
    branches: ["main", "devel"]
  pull_request:
    branches: ["main", "devel"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    uses: max-models/starlight-theme/.github/workflows/docs.yml@v0.5.0
    with:
      # the PyVista scenes in the tutorials render under a virtual display
      xvfb: true
      smoke-paths: |
        getting-started/installation/index.html
        tutorials/index.html
        tutorials/grids-and-coordinates/index.html
        tutorials/shapes-and-node-masks/index.html
        tutorials/parallel-grids/index.html
        api/simgeometry/index.html
        api/simgeometry/grid/index.html
        tutorials/grids-and-coordinates/grids_and_coordinates.ipynb
        tutorials/shapes-and-node-masks/shapes_and_node_masks.ipynb
        tutorials/parallel-grids/parallel_grids.ipynb
        tutorials/shapes-and-node-masks/1.png
        tutorials/inspecting-geometry/4.html
        tutorials/conductors-and-level-sets/2.html
        tutorials/shapes-and-node-masks/2.html
        tutorials/building-composite-shapes/5.html
        tutorials/slices-and-coordinate-sampling/4.html
        tutorials/sampling-export-and-diagnostics/2.html
        tutorials/grid-intersections-and-cut-edges/2.html
        tutorials/conductors-and-level-sets/4.html
